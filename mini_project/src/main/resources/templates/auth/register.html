<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 400px; border-radius: 15px;">
        <h3 class="text-center mb-4 text-success">Tạo Tài Khoản</h3>

        <div th:if="${errorMsg}" class="alert alert-danger text-center" th:text="${errorMsg}"></div>

        <div th:if="${successMsg}" class="alert alert-success text-center" th:text="${successMsg}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Tài khoản</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Chọn tên đăng nhập">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-bold">Mật khẩu</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Nhập mật khẩu">
            </div>

            <div class="mb-4">
                <label for="role" class="form-label fw-bold">Quyền hạn (Demo)</label>
                <select class="form-select" id="role" name="role">
                    <option value="ROLE_USER">Nhân viên (Chỉ xem)</option>
                    <option value="ROLE_ADMIN">Quản trị viên (Toàn quyền)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold mb-3">Đăng Ký</button>
        </form>

        <div class="text-center">
            <p class="mb-0">Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none">Đăng nhập</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
