<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>500 - Internal Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">500 - System Error</h4>
                </div>
                <div class="card-body">
                    <h5 th:text="${title}">An unexpected error occurred</h5>
                    <p><strong>Details:</strong> <span th:text="${message}">Error details</span></p>
                    <p class="text-muted"><strong>Path:</strong> <span th:text="${path}">/employees/list</span></p>
                    <a th:href="@{/}" class="btn btn-primary">Back to home page</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
