<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>409 - Conflict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-info">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">409 - Data Conflict</h4>
                </div>
                <div class="card-body">
                    <h5 th:text="${title}">The resource already exists</h5>
                    <p><strong>Details:</strong> <span th:text="${message}">Error details</span></p>
                    <p class="text-muted"><strong>Path:</strong> <span th:text="${path}">/employees/add</span></p>
                    <a href="#" onclick="history.back(); return false;" class="btn btn-primary">Quay lại trang trước</a>
                    <a th:href="@{/}" class="btn btn-primary">Back to home page</a>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
