<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>405 - Method Not Allowed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">405 - Method Not Allowed</h4>
                </div>
                <div class="card-body">
                    <h5 class="text-danger" th:text="${title}">HTTP method not supported</h5>
                    <p><strong>Details:</strong> <span th:text="${message}">You are using the wrong HTTP method (GET/POST).</span></p>
                    <p class="text-muted"><strong>Path:</strong> <span th:text="${path}">/employees/add</span></p>

                    <hr>
                    <a th:href="@{/}" class="btn btn-outline-danger">Back to home page</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
