<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container mt-5">
    <h2>Hệ thống Quản lý Nhân viên</h2>
    <hr>

    <div class="d-flex justify-content-between mb-3">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/employees/add}" class="btn btn-success">Thêm mới nhân viên</a>

        <form th:action="@{/employees/list}" method="get" class="d-flex">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Tìm tên, phòng ban...">
            <button type="submit" class="btn btn-primary">Tìm</button>
            <a th:href="@{/employees/list}" class="btn btn-secondary ms-2">Xóa</a>
        </form>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tên nhân viên</th>
            <th>Email</th>
            <th>Phòng ban</th>
            <th sec:authorize="hasRole('ADMIN')">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}">${emp.id}</td>
            <td th:text="${emp.name}">${emp.name}</td>
            <td th:text="${emp.email}">${emp.email}</td>
            <td th:text="${emp.departmentName}">${emp.departmentName}</td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-warning">Sửa</a>

                <form th:action="@{/employees/delete/{id}(id=${emp.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa nhân viên này không?');">
                    <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}" sec:authorize="hasRole('ADMIN')">
            <td colspan="5" class="text-center text-muted">Không tìm thấy nhân viên nào!</td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}" sec:authorize="!hasRole('ADMIN')">
            <td colspan="4" class="text-center text-muted">Không tìm thấy nhân viên nào!</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 0}" class="d-flex justify-content-between align-items-center mt-3">
        <div class="text-muted">
            Hiển thị trang <b th:text="${currentPage}">1</b> / <b th:text="${totalPages}">5</b>
            (Tổng số <b th:text="${totalItems}">25</b> bản ghi)
        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination mb-0">

                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/employees/list(keyword=${keyword}, page=${currentPage - 1})}">Trước</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/employees/list(keyword=${keyword}, page=${i})}" th:text="${i}">1</a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/employees/list(keyword=${keyword}, page=${currentPage + 1})}">Sau</a>
                </li>

            </ul>
        </nav>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
