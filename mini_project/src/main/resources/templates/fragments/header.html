<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/employees/list}">🌟 Mini Project</a>

        <div class="d-flex ms-auto align-items-center">

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-outline-light me-2">Đăng Nhập</a>
                <a th:href="@{/register}" class="btn btn-primary">Đăng Ký</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                    <span class="text-light me-3">
                        Xin chào, <b class="text-warning" sec:authentication="name">Người dùng</b>
                        <span class="badge bg-secondary ms-1" sec:authentication="principal.authorities[0].authority">ROLE</span>
                    </span>

                <form th:action="@{/logout}" method="post" class="m-0 p-0">
                    <button type="submit" class="btn btn-danger btn-sm fw-bold">Đăng Xuất</button>
                </form>
            </div>
        </div>
    </div>
</nav>

</html>
