server:
  port: 80 # Đổi port về 80 (chuẩn web) thay vì 8080

spring:
  datasource:
    url: ${DB_MINI_PROJECT_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
# Tùy chỉnh Log cho môi trường Prod (Ghi ra file để lưu trữ)
logging:
  level:
    root: WARN # Chỉ in log cảnh báo và lỗi, ẩn hết log INFO rác
    com.huuhv.mini_project: INFO
  file:
    name: logs/mini-project-prod.log # Ghi log ra file cứng
management:
  endpoints:
    web:
      exposure:
        include: health  # Chỉ expose health cho load balancer
  endpoint:
    health:
      show-details: never  # Không lộ DB info ra ngoài
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}